name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Bikin project
        run: |
          mkdir -p app
          cd app
          cat > main.py << 'EOF'
          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          from kivy.uix.button import Button

          class CyberToolApp(App):
              def build(self):
                  layout = BoxLayout(orientation="vertical", padding=20, spacing=10)
                  layout.add_widget(Label(text="[b]CyberTool[/b]", markup=True, font_size="32sp"))
                  layout.add_widget(Label(text="Running on Android", font_size="16sp"))
                  btn = Button(text="Klik Saya", size_hint=(1, 0.3))
                  btn.bind(on_press=lambda x: setattr(x, "text", "Berhasil!"))
                  layout.add_widget(btn)
                  return layout

          if __name__ == "__main__":
              CyberToolApp().run()
          EOF

          cat > buildozer.spec << 'EOF'
          [app]
          title = CyberTool
          package.name = cybertool
          package.domain = org.cybertool
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.ndk_api = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.allow_backup = True
          android.permissions = INTERNET,ACCESS_NETWORK_STATE

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK
        run: |
          cd app
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cybertool-apk
          path: app/bin/*.apk
